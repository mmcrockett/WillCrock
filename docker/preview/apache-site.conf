<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /app/public
    FcgidInitialEnv WILLCROCK_CONFIG /etc/willcrock-preview.toml

    <Directory /app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ScriptAlias /willcrock.fcgi /usr/local/bin/willcrock.fcgi
    <Directory /usr/local/bin>
        Options +ExecCGI
        AllowOverride None
        Require all granted
        AddHandler fcgid-script .fcgi
        FcgidWrapper /usr/local/bin/willcrock.fcgi .fcgi
    </Directory>

    SetEnvIf Request_URI "^/preview$" willcrock_preview
    Header always set Set-Cookie "session=willcrock-preview-token; Path=/; HttpOnly; SameSite=Lax" env=willcrock_preview
    RedirectMatch 302 ^/preview$ /recipes
</VirtualHost>

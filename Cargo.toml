[package]
name = "willcrock"
version = "0.1.0"
edition = "2021"

[dependencies]
fastcgi = "1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"

[profile.release]
strip = true
